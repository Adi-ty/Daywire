name: Daily Daywire

on:
  schedule:
    - cron: '30 0 * * *' # Starts at 06:00 Asia/Kolkata; not an exact delivery SLA.
  workflow_dispatch:
    inputs:
      edition_date:
        description: 'Edition date in Asia/Kolkata (YYYY-MM-DD); blank means today'
        type: string
        required: false

concurrency:
  group: daywire-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  edition:
    # Scheduling is opt-in so creating the repository does not start paid calls.
    if: vars.DAYWIRE_GENERATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      date: ${{ steps.date.outputs.date }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version: stable
          cache: false
      - name: Freeze edition date
        id: date
        env:
          INPUT_DATE: ${{ inputs.edition_date }}
        run: |
          python3 - <<'PY'
          import datetime, os, zoneinfo
          value = os.environ.get('INPUT_DATE') or datetime.datetime.now(zoneinfo.ZoneInfo('Asia/Kolkata')).date().isoformat()
          parsed = datetime.date.fromisoformat(value)
          if parsed.isoformat() != value:
              raise SystemExit('Use YYYY-MM-DD')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'date={value}\n')
          PY
      - name: Restore public archive
        run: bash scripts/content-branch.sh restore
      - name: Restore private checkpoints
        id: restore
        env:
          EDITION_DATE: ${{ steps.date.outputs.date }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: go run ./cmd/daywire checkpoint --direction restore --date "$EDITION_DATE"
      - name: Collect, draft, verify
        env:
          EDITION_DATE: ${{ steps.date.outputs.date }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: go run ./cmd/daywire generate --date "$EDITION_DATE"
      - name: Set up Kokoro Python
        id: speech_python
        if: vars.DAYWIRE_RADIO_ENABLED == 'true' && vars.TTS_PROVIDER != 'elevenlabs'
        continue-on-error: true
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: internal/audio/kokoro/requirements.txt
      - name: Cache public Kokoro weights
        if: vars.DAYWIRE_RADIO_ENABLED == 'true' && vars.TTS_PROVIDER != 'elevenlabs' && steps.speech_python.outcome == 'success'
        continue-on-error: true
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/daywire-models
          # Reuse large model weights across voices; missing voices are small downloads.
          key: kokoro-shared-${{ runner.os }}-${{ hashFiles('internal/audio/kokoro/model.json', 'internal/audio/kokoro/requirements.txt') }}
      - name: Install speech runtime
        id: speech_runtime
        if: vars.DAYWIRE_RADIO_ENABLED == 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'kokoro' }}
          PYTHON_READY: ${{ steps.speech_python.outcome }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          if [ "$TTS_PROVIDER" = kokoro ]; then
            test "$PYTHON_READY" = success
            bash scripts/setup-kokoro.sh
          fi
      - name: Produce radio
        id: radio
        if: vars.DAYWIRE_RADIO_ENABLED == 'true' && steps.speech_runtime.outcome == 'success'
        continue-on-error: true # An audio outage must not suppress the newspaper.
        timeout-minutes: 20
        env:
          EDITION_DATE: ${{ steps.date.outputs.date }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'kokoro' }}
          KOKORO_VOICE: ${{ vars.KOKORO_VOICE || 'cycle' }}
          KOKORO_SPEED: ${{ vars.KOKORO_SPEED || '1.0' }}
          KOKORO_DEVICE: cpu
          HF_HOME: ${{ runner.temp }}/daywire-models
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          MEDIA_PUBLIC_URL: ${{ vars.MEDIA_PUBLIC_URL }}
        run: |
          if [ "$TTS_PROVIDER" = kokoro ]; then
            voices=(bf_isabella bf_emma bf_alice bf_lily af_heart af_bella af_alloy af_aoede af_jessica af_kore af_nicole af_nova af_river af_sarah af_sky)
            if [ "$KOKORO_VOICE" = cycle ]; then
              # Date-based rotation: retries keep the same voice. UTC arithmetic
              # avoids DST; EDITION_DATE is already frozen in Asia/Kolkata.
              day=$(( $(date -u -d "$EDITION_DATE" +%s) / 86400 ))
              start=$(( $(date -u -d '2026-10-26' +%s) / 86400 ))
              index=$(( ((day - start) % ${#voices[@]} + ${#voices[@]}) % ${#voices[@]} ))
              export KOKORO_VOICE="${voices[$index]}"
            fi
            found=false
            for voice in "${voices[@]}"; do
              if [ "$voice" = "$KOKORO_VOICE" ]; then found=true; break; fi
            done
            if [ "$found" != true ]; then
              echo 'KOKORO_VOICE must be cycle or a supported English female voice' >&2
              exit 1
            fi
            echo "Kokoro narrator for $EDITION_DATE: $KOKORO_VOICE (ready audio is preserved)"
          fi
          go run ./cmd/daywire radio --file "content/editions/$EDITION_DATE.json"
      - name: Report unavailable narration
        if: vars.DAYWIRE_RADIO_ENABLED == 'true' && (steps.speech_runtime.outcome != 'success' || steps.radio.outcome != 'success')
        run: echo '::warning::Radio was not generated. The newspaper will still be built and preserved; inspect the speech steps before retrying.'
      - name: Save private checkpoints even if generation fails
        if: always() && steps.restore.outcome == 'success'
        env:
          EDITION_DATE: ${{ steps.date.outputs.date }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: go run ./cmd/daywire checkpoint --direction save --date "$EDITION_DATE"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install and build
        working-directory: web
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
      - name: Save public editions for the publication job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: editions
          path: content/editions/*.json
          if-no-files-found: error
          retention-days: 14
      - name: Save built site for review or static hosting
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daywire-site
          path: web/dist
          if-no-files-found: error
          retention-days: 14

  preserve:
    needs: edition
    if: vars.DAYWIRE_PUBLICATION_ENABLED == 'true'
    environment: daywire-publication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5
        with:
          go-version: stable
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: editions
          path: content/editions
      - name: Commit only validated public editions
        run: bash scripts/content-branch.sh save
      - name: Request Vercel rebuild after saving the archive
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl --fail --silent --show-error --retry 3 --max-time 30 \
              --request POST "$VERCEL_DEPLOY_HOOK" > /dev/null
            echo 'Vercel rebuild requested. Check Vercel for deployment completion.'
          else
            echo 'VERCEL_DEPLOY_HOOK is unset; archive saved without requesting deployment.'
          fi
